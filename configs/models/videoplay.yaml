# VideoPlay-YOLO11: P4-P5 head, half-width channels, DWConv downsampling, ReLU.
# Scale key remains "n" so Ultralytics compound scaling is unchanged.
nc: 1
activation: nn.ReLU()
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, DWConv, [16, 3, 2]]
  - [-1, 1, DWConv, [32, 3, 2]]
  - [-1, 2, C3k2, [64, False, 0.25]]
  - [-1, 1, DWConv, [64, 3, 2]]
  - [-1, 2, C3k2, [128, False, 0.25]]
  - [-1, 1, DWConv, [128, 3, 2]]
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, DWConv, [256, 3, 2]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, SPPF, [256, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]
  - [-1, 1, DWConv, [128, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [[12, 15], 1, Detect, [nc]]
