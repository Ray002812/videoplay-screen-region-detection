# YOLO11 视频检测模型 - 12_15版本
# 修改：前半部分1/2通道，后半部分1/4通道，移除P3检测头，使用ReLU激活

# Parameters
nc: 1 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # width=0.25 作为基准

# 激活函数：代码已默认使用ReLU (Conv.default_act = nn.ReLU())

# YOLO11n backbone
# 前半部分(P1-P3): 通道数基数*2，实现1/2效果
# 后半部分(P4-P5): 通道数基数保持，实现1/4效果
backbone:
  # [from, repeats, module, args]
  # === 前半部分：1/2通道 (基数*2) ===
  - [-1, 1, Conv, [128, 3, 2]]   # 0-P1/2   128*0.25=32 (原版64的1/2)
  - [-1, 1, Conv, [256, 3, 2]]   # 1-P2/4   256*0.25=64 (原版128的1/2)
  - [-1, 2, C3k2, [512, False, 0.25]]  # 512*0.25=128 (原版256的1/2)
  - [-1, 1, Conv, [512, 3, 2]]  # 3-P3/8   512*0.25=128 (原版256的1/2)
  - [-1, 2, C3k2, [1024, False, 0.25]] # 1024*0.25=256 (原版512的1/2)
  
  # === 后半部分：1/4通道 (基数保持) ===
  - [-1, 1, DWConv, [256, 3, 2]] # 5-P4/16  256*0.25=64 (原版256的1/4)
  - [-1, 2, C3k2, [256, True]]   # 256*0.25=64
  - [-1, 1, DWConv, [512, 3, 2]] # 7-P5/32  512*0.25=128 (原版512的1/4)
  - [-1, 2, C3k2, [512, True]]   # 512*0.25=128
  - [-1, 1, SPPF, [512, 5]]      # 9  512*0.25=128

# YOLO11n head - 只保留P4和P5检测头，1/4通道
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]    # cat backbone P4
  - [-1, 2, C3k2, [256, False]]  # 12  256*0.25=64

  - [-1, 1, DWConv, [256, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]    # cat head P5
  - [-1, 2, C3k2, [512, True]]   # 15 (P5/32-large)  512*0.25=128

  - [[12, 15], 1, Detect, [nc]]  # Detect(P4, P5) - 无P3
